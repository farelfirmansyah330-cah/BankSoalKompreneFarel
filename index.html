<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Soal Komprehensif PWK</title>
<style>
  :root {
    --paper: #F7F3EA;
    --paper-line: #E1D9C6;
    --ink: #1F3A52;
    --ink-soft: #4A5F70;
    --accent: #B8622E;
    --correct: #2F6B4F;
    --correct-bg: #E5EFE7;
    --wrong: #A6392F;
    --wrong-bg: #F5E6E2;
    --card: #FFFFFF;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  body {
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 32px 32px;
    background-attachment: fixed;
    min-height: 100vh;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 22px;
    gap: 12px;
  }
  header .title-block h1 {
    font-size: 1.55rem;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
    font-weight: 600;
  }
  header .title-block p {
    margin: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .compass {
    width: 40px; height: 40px;
    flex-shrink: 0;
    opacity: 0.85;
  }

  .statusbar {
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .progress-track {
    height: 4px;
    background: var(--paper-line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 26px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.35s ease;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 28px 26px 22px;
    box-shadow: 0 1px 0 rgba(31,58,82,0.04);
    position: relative;
  }
  .card::before {
    content: attr(data-tahun);
    position: absolute;
    top: -11px;
    left: 24px;
    background: var(--ink);
    color: var(--paper);
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.5px;
    padding: 3px 9px;
    border-radius: 2px;
  }
  .soal {
    font-size: 1.12rem;
    line-height: 1.55;
    margin: 6px 0 22px;
  }
  .options {
    list-style: none;
    margin: 0; padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 12px 14px;
    cursor: pointer;
    background: #FFFEFC;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    font-size: 0.96rem;
    line-height: 1.45;
  }
  .option:hover:not(.locked) {
    border-color: var(--ink);
    background: #FBF9F4;
  }
  .option .letter {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .option.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .option.correct .letter {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }
  .option.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .option.wrong .letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }
  .option.locked { cursor: default; }
  .option.dim { opacity: 0.55; }

  .feedback {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 3px;
    display: none;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  .feedback.show { display: block; }
  .feedback.is-correct { background: var(--correct-bg); border-left: 3px solid var(--correct); }
  .feedback.is-wrong { background: var(--wrong-bg); border-left: 3px solid var(--wrong); }
  .feedback .verdict {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 6px;
  }
  .feedback.is-correct .verdict { color: var(--correct); }
  .feedback.is-wrong .verdict { color: var(--wrong); }
  .feedback .pembahasan-label {
    text-transform: none;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin-top: 10px;
    margin-bottom: 3px;
  }
  .feedback .pembahasan-body {
    color: var(--ink);
  }
  .feedback .no-pemb {
    color: var(--ink-soft);
    font-style: italic;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  button {
    font-family: inherit;
    font-size: 0.9rem;
    border: none;
    cursor: pointer;
    border-radius: 3px;
    padding: 11px 20px;
    font-weight: 600;
  }
  .btn-next {
    background: var(--ink);
    color: var(--paper);
    opacity: 0.35;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .btn-next.active { opacity: 1; pointer-events: auto; }
  .btn-next:hover.active { background: #16283a; }
  .link-btn {
    background: none;
    color: var(--ink-soft);
    font-weight: 500;
    text-decoration: underline;
    padding: 8px 4px;
  }

  .score-line {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }

  /* summary screen */
  .summary {
    text-align: center;
    padding: 50px 26px;
  }
  .summary .big {
    font-size: 3rem;
    font-weight: 700;
    color: var(--ink);
    margin: 6px 0;
  }
  .summary p { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--ink-soft); }
  .summary-actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; }
  .btn-primary {
    background: var(--ink); color: var(--paper);
  }
  .btn-secondary {
    background: transparent; color: var(--ink); border: 1.5px solid var(--ink) !important;
  }

  @media (max-width: 480px) {
    .wrap { padding: 18px 14px 60px; }
    .card { padding: 22px 16px 18px; }
    header .title-block h1 { font-size: 1.25rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  .option:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Bank Soal Komprehensif PWK</h1>
      <p>Kompilasi soal kating 2021&ndash;2024 &middot; UGM PWK</p>
    </div>
    <svg class="compass" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="18" stroke="#1F3A52" stroke-width="1.2"/>

      <circle cx="20" cy="20" r="2" fill="#1F3A52"/>

  <div id="quizArea">

      <button class="link-btn" id="shuffleBtn">Acak ulang soal</button>
      <button class="btn-next" id="nextBtn">Soal berikutnya &rarr;</button>

  <div id="summaryArea" style="display:none;">
    <div class="card summary">
      <p>Hasil akhir</p>
      <div class="big" id="summaryScore">0 / 93</div>
      <p id="summaryNote"></p>
      <div class="summary-actions">
        <button class="btn-primary" id="restartBtn">Ulangi dari awal</button>
        <button class="btn-secondary" id="reviewBtn">Tinjau soal salah</button>
      </div>
    </div>
  </div>
</div>

re Ground : Persebaran Bangunan, informasi solid void", "tahun": "2021"}, {"soal": "Dalam analisis morfologi atau fabric lingkungan terbangun kawasan dan/atau kota dikenal dengan peta analisis 2 dimensi urban fabric. Peta analisis 2 dimensi yang mampu memberikan informasi terkait derajat besar kecilnya walkability dalam ruang adalah", "options": [{"letter": "a", "text": "Peta figure ground"}, {"letter": "b", "text": "Peta eyes on street"}, {"letter": "c", "text": "Peta interface public dan privat bangunan"}, {"letter": "d", "text": "Peta block pattern"}, {"letter": "e", "text": "Peta nolli"}], "correct": "d", "pembahasan": "Situasi (Block Plan): Gabungan massa bangunan dengan kondisi tapak/ lahan/ lingkungan alam yang menginformasikan pembentukan tataan ruang (komposisi massa bangunan) membentuk tataan ruang. Memuat gambar bangunan lain hingga jalan terbesar dan akses transportasi -> morfologi", "tahun": "2021"}, {"soal": "ada data dengan tipe ordinal, metode pengolahan data yang tepat untuk menemukan ukuran kecenderungan terpusat (measure of central tendency) adalah", "options": [{"letter": "a", "text": "Modus"}, {"letter": "b", "text": "Modus dan mean"}, {"letter": "c", "text": "Median dan mean"}, {"letter": "d", "text": "Modus dan median"}, {"letter": "e", "text": "Modus, median, mean"}], "correct": "d", "pembahasan": "", "tahun": "2021"}, {"soal": "1. Proximity dalam menjangkau fasilitas pelayanan lingkungan 2. Radius Keterjangkauan lingkungan sebesar 400- 800 meter 3. Memiliki center berupa taman kota yang harus terletak di tengah ruang kawasan 4. Memiliki guna lahan campuran (Mix Use) yang semakin intens di dekat center 5. Memiliki tingkat densitas optimal yang semakin tinggi di tepi atau edge ruang kawasan Berdasarkan pernyataan poin 1-5 tersebut, prinsip- prinsip ideal perencanaan ruang kawasan (Neighborhood Plan) berdasarkan Emily Talen, New Urbanism, Clarence Perry adalah", "options": [{"letter": "a", "text": "1, 2, 3, 4"}, {"letter": "b", "text": "1, 4, 5"}, {"letter": "c", "text": "1, 2, 4"}, {"letter": "d", "text": "1, 2, 5"}, {"letter": "e", "text": "3, 4, 5"}], "correct": "b", "pembahasan": "", "tahun": "2021"}, {"soal": "Pertumbuhan wilayah dapat dilihat dari indikator berikut", "options": [{"letter": "a", "text": "Pertumbuhan penduduk"}, {"letter": "b", "text": "Pertumbuhan pendapatan per kapita"}, {"letter": "c", "text": "Perubahan struktur ekonomi"}, {"letter": "d", "text": "A, B, C benar"}, {"letter": "e", "text": "Semua jawaban salah"}], "correct": "d", "pembahasan": "", "tahun": "2021"}, {"soal": "Jika Kecamatan Y ada Rumah Sakit tipe A, tapi kecamatan lain di Kota Z tidak ada rumah sakit. Artinya apa? Kecamatan Y di Kota Z memiliki rumah sakit bertipe A, sedangkan kecamatan lain di kota Z tidak memiliki rumah sakit. Namun terdapat rumah sakit di kecamatan lain di kota sebelahnya , bagaimana? y a gimana pak Kyknya klo yg ini itu Kec Y dan Kec lain di kota sebelah pny orde yg sama dee cmiiw -> keknya seingetku jg gini Cmiiw Kalau ga salah soalnya kec Y ada RS, kec z juga punya fasilitas sama Yaudah kalau soalnya gini jawab c, kalau soal atas jawab d :) lanjott HAHAH okayyyy SEKKK tapii klo jawaban c itu hrsnya kec Y dan kec z kann yg pny orde sama? Bukan kec Y kota Z kan? Iyes oh iyeee Sebenernya apakah mungkin 2 kota orde 1 itu bersebelahan?, soalnya ada hint bersebelahan. IYA JG YAA hemm ->> tergantung 1kabupaten ato gakk, kalo satu", "options": [{"letter": "a", "text": "Kota Z mutlak orde 1"}, {"letter": "b", "text": "Kec Y tidak ada hubungannya dengan orde, tapi kota Z orde 1"}, {"letter": "c", "text": "Kec Y dan Kota Z orde 1"}, {"letter": "d", "text": "Kec Y mutlak berhierarki paling tinggi"}, {"letter": "e", "text": "Kec Y tidak berarti apa-apa (hanya kebetulan ada RS), Kota Z orde I"}], "correct": "d", "pembahasan": "Kecamatan Y = Orde I Orde Kota tidak bisa ditentukan, karena harus dibandingkan dengan fasilitas di kota lain ● Orde struktur kota : PKN →PKW →PKL →PPK (Pusat Pelayanan Kawasan)→PPL (P  "Studi kasus"}], "correct": "a", "pembahasan": "● Induktif = Khusus ke umum, membangun teori/konsep dari fakta di lapangan ● Deduktif = Umum ke khusus, menguji teori/konsep dengan fakta di lapangan ● Delphi = proses yang dilakukan dalam kelompok untuk mensurvei dan mengumpulkan pendapat dari para ahli terkait topik tertentu ● Content analysis = metode dengan mengkaji dokumen kebijakan/ video/ dll sebagainya untuk", "tahun": "2022"}, {"soal": "Hukum pengaturan guna lahan (?) yang dipakai pemerintah, kecuali Paradigma yang dianut oleh pemerintah Indonesia, kecuali?", "options": [{"letter": "a", "text": "nuisance law"}, {"letter": "b", "text": "domain power"}, {"letter": "c", "text": "the police power"}, {"letter": "d", "text": "eminent domain"}, {"letter": "e", "text": "compensatory relief"}], "correct": "b", "pembahasan": "●Nuisance law = tidak seorang pun memiliki hak untuk menggunakan properti yang dapat merugikan tetangga ●Domain power = ?? ●The police power = pembatasan penggunaan milik pribadi yang merugikan kepentingan umum dalam segala bentuknya ●Eminent domain = power untuk mengambil private properties untuk kepentingan publik ●Compensatory relief = mendapatkan kompensasi uang atas kerusakan atau cedera yang disebabkan oleh orang atau penggugat. Anjir bisa ketemu 👍👍👍👍👍dengan kekuatan bulan", "tahun": "2022"}, {"soal": "Seorang lagi meneliti di jalan, lalu mencari data dengan tanya orang yang lagi le wat di jalan, disebut sampling apakah ini?", "options": [{"letter": "a", "text": "Purposive sampling"}, {"letter": "b", "text": "Random Sampling"}, {"letter": "c", "text": "Convenience Sampling"}, {"letter": "d", "text": "Simple random sampling"}, {"letter": "e", "text": "Simple random sampling"}], "correct": "c", "pembahasan": "Convenience sampling atau Sampling Kebetulan (accidental sampling) Contoh: Ketika perusahaan mendistribusikan pamflet promosi mereka dan mengajukan pertanyaan di mal atau di jalan yang ramai dengan peserta yang dipilih secara acak a) Probability Sampling = setiap populasi memiliki probabilitas yang sama untuk menjadi sampel 1. Simple random sampling : seleksi secara acak 2. Stratified Random sampling : penarikan sampel acak terstruktur dilakukan dengan membagi anggota populasi dalam beberapa sub kelompok (strata) 3. Cluster random sampling : karakteristik kelompok / cluster yang sama dianggap mewakili populasi 4. Systematic random populasi : cara pengambilan sampel dimana sampel pertama ditentukan secara acak, sedangkan sampel berikutnya diambil berdasarkan satu interval tertentu. b) Non-Probability Sampling", "tahun": "2022"}, {"soal": "Dalam Pearson Correlation variabel a dan b memiliki r = -0,87 artinya", "options": [{"letter": "a", "text": "Korelasi kuat …"}, {"letter": "b", "text": "Korelasi kuat …"}, {"letter": "c", "text": "Korelasi kuat, jika A naik, maka B turun"}, {"letter": "d", "text": "Tidak ada korelasi"}, {"letter": "e", "text": "Korelasi lemah"}], "correct": "c", "pembahasan": "- r digunakan untuk melihat kekuatan korelasi antar 2 variabel melalui r2 - Jika r2>0,5 dan mendekati 1=korelasi kuat - Tanda (-/+) menunjukkan arah hubungannya (positif/sejalan dan negatif/berkebalikan) 0,872=0,76 maka korelasi kuat Negatif = jika A naik, maka B turun (karena hubungannya terbalik)", "tahun": "2022"}, {"soal": "Gambar Peta Tegal Jalan arteri yang menyebabkan kemacetan dll, terus ada pedestrian ways Jl Ahmad Yani. Ini sebut apa?", "options": [{"letter": "a", "text": "Deskripsi"}, {"letter": "b", "text": "Interpretasi spasial"}, {"letter": "c", "text": "Sebab akibat (interelasi)"}, {"letter": "d", "text": "korelasi?"}], "correct": "c", "pembahasan": "Interpretasi Spasial-Peta - Distribusi: sebaran sarana - Sebab-Akibat →menggambarkan hubungan sebab dan akibat (ada jalan arteri, jadi macet) - Deskripsi →menggambarkan/mendeskripsikan suatu kondisi wilayah - Korelasi →menyeluruh", "tahun": "2022"}, {"soal": "Gambar Economic Fabric (Sistem tata bangunan sektor ekonomi yang sehat). Manakah yang benar yak keuntungan seperti meningkatkan kapasitas daya (ap ini peningkatan daya puncak) dalam sistem tenaga, mengurangi kerugian daya dalam sistem tenaga, dan meningkatkan profil tegangan Hak jalan bisa jadi nyambung soalnya ngurangin prasarana buat transmisi listriknya ga si mba (?) jadi ga banyak tiang listrik -> hak jalan lebih baik Tapi yg b jg bener wkwk Gatau deh wkwkw aku blm terlalu paham apa itu DG sebeenernya Distributed Generation seringkali disebut juga dengan on-site generation, dispersed generation, embedded generation, decentralized", "tahun": "2022"}, {"soal": "Untuk meneliti tentang kawasan yang sudah lama mengalami perubahan bentuk Melihat bentuk asli ruang yg telah berkembang", "options": [{"letter": "a", "text": "Morfogenesis"}, {"letter": "b", "text": "Persisted morphology (ini persisted/bertahan jadi ga berubah bentuk)"}, {"letter": "c", "text": "Space DNA xxx"}, {"letter": "d", "text": "Ontogenesis"}, {"letter": "e", "text": "Evolusi"}], "correct": "a", "pembahasan": "Ontogenesis = bagaimana ayam bisa hidup dari telur (perkembangan dari bentuk yang sederhana menjadi lebih komplex) Phylogenesis = evolusi dari Gallus Gallus (ayam merah) (perkembangan dari satu spesies menjadi beberapa spesies-evolusi) Morfogenesis = proses perkembangan embrio (dari embrio menjadi dewasa) WOY ADA MORFOGENESIS BATUAN!! Morfogenesis selain embrio: Morfogenesis menggambarkan asal terbentuknya batuan dan proses pembentukannya yang diperoleh dari litologi, struktur geologi, serta pola aliran sungai. Morfologi = ilmu tentang bentuk Secara detail, perubahan dapat dilihat secara ontogenesis yaitu bentuk asli atau perubahan dari suatu unit/individu dan secara phylogenesis yaitu sejarah, kronologis atau evolusi dari suatu type. Untuk", "tahun": "2022"}, {"soal": "4 step model untuk menentukan rute perjalanan disebut dengan", "options": [{"letter": "a", "text": "Modal split"}, {"letter": "b", "text": "Trip distribution"}, {"letter": "c", "text": "Trip assignment"}, {"letter": "d", "text": "Trip contribution"}, {"letter": "e", "text": "Trip generation"}], "correct": "c", "pembahasan": "Generation: bangkitan (trip production) = perjalanan yang mempunyai tempat asal dari kawasan perumahan di tata guna lahan tertentu Distribution: mau ke mana (tujuan dari bangkitan mau kemana) Modal Split: pemilihan moda Assignment: Jalur/rute yang mau dilalui", "tahun": "2022"}, {"soal": "Kemiskinan ditinjau dari jumlah rupiah yg digunakan untuk makan 2100 kalori", "options": [{"letter": "a", "text": "Ekonomi"}, {"letter": "b", "text": "Kesehatan"}, {"letter": "c", "text": "Sosial"}, {"letter": "d", "text": "kebijakan"}], "correct": "a", "pembahasan": "Untuk mengukur kemiskinan, BPS menggunakan konsep kemampuan memenuhi kebutuhan dasar (basic needs approach). Konsep ini mengacu pada Handbook on Poverty and Inequality yang diterbitkan oleh Worldbank. Dengan pendekatan ini, kemiskinan dipandang sebagai ketidakmampuan dari sisi ekonomi untuk memenuhi kebutuhan dasar makanan dan bukan makanan yang diukur dari sisi pengeluaran. Penduduk dikategorikan sebagai penduduk miskin jika memiliki rata-rata pengeluaran per kapita per bulan di bawah garis kemiskinan. Garis Kemiskinan Makanan (GKM) merupakan nilai pengeluaran minimum untuk kebutuhan makanan yang disetarakan dengan 2100 kilokalori per kapita per hari. Nitip ● Kemiskinan relatif: kondisi miskin karena pengaruh kebijakan pembangunan yang belum menjangkau seluruh masyarakat, sehingga menyebabkan ketimpangan pada pendapatan.", "tahun": "2022"}, {"soal": "Kriteria lokasi industri yang benar adalah", "options": [{"letter": "a", "text": "Jauh dari permukiman"}, {"letter": "b", "text": "Di daerah lindung"}, {"letter": "c", "text": "Di rawa2"}, {"letter": "d", "text": "Sempadan sungai"}, {"letter": "e", "text": "Diantara perkantoran"}], "correct": "a", "pembahasan": "Kriteria lokasi industri: - Bukan lahan subur pertanian - Bukan permukiman dan hutan lindung - Kelerengan <5% - Dekat dengan jalan raya maks 1 km - Jauh  "pembahasan": "", "tahun": "2024"}, {"soal": "Pengertian NSDA yang paling sesuai", "options": [{"letter": "a", "text": "menghitung cadangan yang belum dimanfaatkan secara optimal"}, {"letter": "b", "text": "menghitung potensi yang sudah digunakan"}, {"letter": "c", "text": "menghitung sumber daya alam"}], "correct": "a", "pembahasan": "", "tahun": "2024"}, {"soal": "Visualisasi untuk data time series perkembangan penduduk?", "options": [{"letter": "a", "text": "line"}, {"letter": "b", "text": "scatter"}, {"letter": "c", "text": "bar"}, {"letter": "d", "text": "pie"}, {"letter": "e", "text": "radar"}], "correct": "a", "pembahasan": "Soal kompre kating 19", "tahun": "2024"}, {"soal": "Metode yang membawa suatu teori atau konsep yang sudah ada kemudian diuji di lapangan", "options": [{"letter": "a", "text": "Induktif"}, {"letter": "b", "text": "Deduktif"}, {"letter": "c", "text": "Delphi"}, {"letter": "d", "text": "Content Analysis"}, {"letter": "e", "text": "Studi Kasus"}], "correct": "b", "pembahasan": "Soal kompre kating 19", "tahun": "2024"}, {"soal": "kriteria lokasi industri yang benar", "options": [{"letter": "a", "text": "jauh dari permukiman"}, {"letter": "b", "text": "di kawasan lindung"}, {"letter": "c", "text": "di rawa-rawa"}, {"letter": "d", "text": "sempadan sungai"}, {"letter": "e", "text": "diantara perkantoran"}], "correct": "a", "pembahasan": "Soal kompre kating 19", "tahun": "2024"}]</script>
<script>
  const RAW = JSON.parse(document.getElementById('questionData').textContent);

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let order = shuffle(RAW.map((_, i) => i));
  let idx = 0;
  let score = 0;
  let answered = new Array(RAW.length).fill(false);
  let wasCorrect = new Array(RAW.length).fill(false);
  let missedIndices = [];
  let reviewMode = false;
  let reviewList = [];

  const soalText = document.getElementById('soalText');
  const optionsList = document.getElementById('optionsList');
  const feedback = document.getElementById('feedback');
  const verdict = document.getElementById('verdict');
  const pembBody = document.getElementById('pembBody');
  const counter = document.getElementById('counter');
  const scoreLine = document.getElementById('scoreLine');
  const progressFill = document.getElementById('progressFill');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const card = document.getElementById('card');
  const quizArea = document.getElementById('quizArea');
  const summaryArea = document.getElementById('summaryArea');
  const summaryScore = document.getElementById('summaryScore');
  const summaryNote = document.getElementById('summaryNote');

  const verdictLabels = {
    correct: ['Tepat sekali.', 'Benar.', 'Betul.', 'Jawaban tepat.'],
    wrong: ['Belum tepat.', 'Kurang tepat.', 'Masih keliru.', 'Coba lagi lain kali.']
  };

  function currentList() {
    return reviewMode ? reviewList : order;
  }

  function renderQuestion() {
    const list = currentList();
    const qIndex = list[idx];
    const q = RAW[qIndex];

    card.setAttribute('data-tahun', q.tahun);
    soalText.textContent = q.soal;
    optionsList.innerHTML = '';
    feedback.className = 'feedback';
    nextBtn.classList.remove('active');

    q.options.forEach(opt => {
      const li = document.createElement('li');
      li.className = 'option';
      li.dataset.letter = opt.letter;
      li.innerHTML = `<span class="letter">${opt.letter.toUpperCase()}</span><span class="opt-text">${opt.text}</span>`;
      li.addEventListener('click', () => handleAnswer(qIndex, opt.letter, li));
      optionsList.appendChild(li);
    });

    counter.textContent = `Soal ${idx + 1} dari ${list.length}` + (reviewMode ? ' (tinjauan)' : '');
    scoreLine.textContent = reviewMode ? `Meninjau soal yang salah` : `Benar ${score}`;
    progressFill.style.width = `${(idx / list.length) * 100}%`;

    if (answered[qIndex] && !reviewMode) {
      revealAnswer(qIndex, null, true);
    }
  }

  function handleAnswer(qIndex, letter, liEl) {
    if (answered[qIndex] && !reviewMode) return;
    const q = RAW[qIndex];
    const isCorrect = letter === q.correct;

    if (!answered[qIndex]) {
      answered[qIndex] = true;
      wasCorrect[qIndex] = isCorrect;
      if (isCorrect) {
        score++;
      } else {
        if (!missedIndices.includes(qIndex)) missedIndices.push(qIndex);
      }
    }
    revealAnswer(qIndex, letter, false);
  }

  function revealAnswer(qIndex, chosenLetter, silent) {
    const q = RAW[qIndex];
    const opts = optionsList.querySelectorAll('.option');
    opts.forEach(li => {
      li.classList.add('locked');
      if (li.dataset.letter === q.correct) {
        li.classList.add('correct');
      } else if (chosenLetter && li.dataset.letter === chosenLetter) {
        li.classList.add('wrong');
      } else {
        li.classList.add('dim');
      }
    });

    const correctNow = wasCorrect[qIndex];
    feedback.classList.add('show');
    feedback.classList.add(correctNow ? 'is-correct' : 'is-wrong');
    const bank = correctNow ? verdictLabels.correct : verdictLabels.wrong;
    verdict.textContent = bank[qIndex % bank.length];

    if (q.pembahasan && q.pembahasan.trim().length > 0) {
      pembBody.textContent = q.pembahasan;
      pembBody.classList.remove('no-pemb');
    } else {
      pembBody.textContent = 'Tidak ada catatan pembahasan tertulis untuk soal ini pada sumber aslinya.';
      pembBody.classList.add('no-pemb');
    }

    scoreLine.textContent = reviewMode ? `Meninjau soal yang salah` : `Benar ${score}`;
    if (!silent) {
      nextBtn.classList.add('active');
    } else {
      nextBtn.classList.add('active');
    }
  }

  function goNext() {
    const list = currentList();
    if (idx < list.length - 1) {
      idx++;
      renderQuestion();
    } else {
      showSummary();
    }
  }

  function showSummary() {
    quizArea.style.display = 'none';
    summaryArea.style.display = 'block';
    const total = reviewMode ? reviewList.length : RAW.length;
    if (reviewMode) {
      summaryScore.textContent = `Tinjauan selesai`;
      summaryNote.textContent = `Kamu sudah meninjau ulang ${reviewList.length} soal yang sebelumnya salah.`;
    } else {
      summaryScore.textContent = `${score} / ${total}`;
      const pct = Math.round((score / total) * 100);
      summaryNote.textContent = `Skor kamu ${pct}%. ` + (missedIndices.length > 0 ? `Ada ${missedIndices.length} soal yang masih perlu ditinjau ulang.` : 'Semua soal terjawab benar.');
    }
    document.getElementById('reviewBtn').style.display = (missedIndices.length > 0 && !reviewMode) ? 'inline-block' : 'none';
  }

  function restart(newOrder) {
    order = newOrder || shuffle(RAW.map((_, i) => i));
    idx = 0;
    score = 0;
    answered = new Array(RAW.length).fill(false);
    wasCorrect = new Array(RAW.length).fill(false);
    missedIndices = [];
    reviewMode = false;
    quizArea.style.display = 'block';
    summaryArea.style.display = 'none';
    renderQuestion();
  }

  nextBtn.addEventListener('click', goNext);
  shuffleBtn.addEventListener('click', () => restart(shuffle(RAW.map((_, i) => i))));
  document.getElementById('restartBtn').addEventListener('click', () => restart());
  document.getElementById('reviewBtn').addEventListener('click', () => {
    reviewMode = true;
    reviewList = missedIndices.slice();
    idx = 0;
    quizArea.style.display = 'block';
    summaryArea.style.display = 'none';
    renderQuestion();
  });

  renderQuestion();
</script>
</body>
